<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Slate Background -->
  <rect width="512" height="512" rx="112" fill="#09090b" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#27272a" stroke-width="4" />

  <!-- Minimalist Drop / Beam Icon -->
  <g filter="url(#subtleGlow)" transform="translate(0, 0)">
    <!-- Radiating Arc Waves -->
    <path d="M 160 270 A 115 115 0 0 1 352 270" fill="none" stroke="#38bdf8" stroke-width="16" stroke-linecap="round" opacity="0.3" />
    <path d="M 195 270 A 75 75 0 0 1 317 270" fill="none" stroke="#38bdf8" stroke-width="16" stroke-linecap="round" opacity="0.6" />

    <!-- Pure Minimalist Teardrop / Pin -->
    <path d="M 256 120 C 210 180 180 230 180 276 C 180 318 214 352 256 352 C 298 352 332 318 332 276 C 332 230 302 180 256 120 Z" fill="url(#dropGrad)" />
    
    <!-- Inner Core Dot -->
    <circle cx="256" cy="276" r="28" fill="#ffffff" />
  </g>
</svg>
