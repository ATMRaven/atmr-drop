name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Inject Build Version into Web Assets
        run: |
          echo "window.APP_VERSION = '1.0.${{ github.run_number }}';" > public/version.js
          echo "Injected window.APP_VERSION = '1.0.${{ github.run_number }}' into public/version.js"

      - name: Sync Capacitor Web Assets
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Signed Release APK
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Name release APK
        run: cp android/app/build/outputs/apk/release/app-release.apk atmr-drop.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: atmr-drop-apk
          path: atmr-drop.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: The Daily Drop Android v1.0.${{ github.run_number }}
          body: |
            ## The Daily Drop (atmr-drop) Android App

            Instant cross-device file, photo, and text wire drop application.
            - **Published by**: atmr
            - **Web Service**: https://drop.atmr.workers.dev
            - **Version**: v1.0.${{ github.run_number }}
            - **Seamless Updates**: Signed with permanent keystore for in-place app updates.

            Download `atmr-drop.apk` below and open it to install or update directly over your existing app.
          files: atmr-drop.apk
