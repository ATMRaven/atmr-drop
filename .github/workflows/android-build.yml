name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Inject Build Version into Web Assets
        run: |
          sed -i "s/window.APP_VERSION = '.*';/window.APP_VERSION = '1.0.${{ github.run_number }}';/" public/version.js
          echo "Injected window.APP_VERSION = '1.0.${{ github.run_number }}' into public/version.js"

      - name: Sync Capacitor Web Assets
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Signed Release APK
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Name release APK
        run: cp android/app/build/outputs/apk/release/app-release.apk atmr-drop.apk

      - name: Upload APK Binary to Cloudflare KV Database
        run: |
          echo "Uploading APK to Cloudflare Database..."
          curl -f -s -X POST "https://drop.atmr.workers.dev/api/apk/upload?version=1.0.${{ github.run_number }}" \
            -H "X-Deploy-Key: atmr_drop_deploy_key_2026" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@atmr-drop.apk"
          echo "APK successfully stored in Cloudflare database for direct in-app downloads!"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: atmr-drop-apk
          path: atmr-drop.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: The Daily Drop Android v1.0.${{ github.run_number }}
          body: |
            • Remapped & elevated upload quick-actions bar: prominent Upload Folder & Take Photo buttons
            • Sender-Only Deletion security: drop receivers can no longer delete drops; only creators retain burn access
            • Universal in-browser file & image inspector lightbox with full-res zoom/pan and code line numbers
            • Dedicated Help & System Info (? button) modal with complete feature guide and dynamic changelog
            • True direct in-app APK downloader and self-updater with live speed progress bar
            • Real-time upload status bar with live speed & transferred byte tracking
            • WebRTC P2P Direct Local LAN Transfer & Zero-Knowledge E2EE (AES-256-GCM)
          files: atmr-drop.apk
